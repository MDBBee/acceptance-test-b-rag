services:
  backend:
    image: b-rag-engine2:1.0.0
    env_file:
      - ./.env.backend
    ports:
      - "8000:8000"
    networks:
      - b-rag-network

  frontend:
    image: b-rag-view:1.0.1
    env_file:
      - ./.env.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - b-rag-network

  acceptance:
    build: .
    env_file:
      - ./.env
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    entrypoint: ["robot", "--outputdir", "results", "tests/smoke"]
    depends_on:
      - frontend
    networks:
      - b-rag-network

networks:
  b-rag-network:
    driver: bridge
